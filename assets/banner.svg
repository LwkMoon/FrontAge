<svg width="1200" height="400" viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#8fa3ba" stroke-width="1" opacity="0.08"/>
    </pattern>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e0a458"/>
      <stop offset="100%" stop-color="#6fb8b3"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="400" fill="#0d1826"/>
  <rect width="1200" height="400" fill="url(#grid)"/>

  <g transform="translate(90,90)" stroke="#e0a458" stroke-width="2" fill="none">
    <circle cx="0" cy="0" r="26"/>
    <path d="M0 -40 L0 -14 M0 14 L0 40 M-40 0 L-14 0 M14 0 L40 0"/>
    <circle cx="0" cy="0" r="5" fill="#e0a458" stroke="none"/>
  </g>

  <text x="150" y="108" font-family="Arial, Helvetica, sans-serif" font-size="64" font-weight="700" fill="#eef3f8" letter-spacing="-1">Frontage</text>
  <text x="151" y="142" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#8fa3ba" letter-spacing="2">STATIC SITES FOR BUSINESSES, PORTFOLIOS &amp; DASHBOARDS</text>

  <text x="150" y="205" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#c3ccd6">Business details in, a polished site out.</text>
  <text x="150" y="231" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#c3ccd6">AI-written copy from Claude, GPT, or Gemini, a downloadable zip.</text>

  <g transform="translate(150,270)">
    <circle cx="6" cy="-5" r="4" fill="#e0a458"/>
    <text x="20" y="0" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#8fa3ba">Flask + SQLite backend, React + Vite frontend</text>
  </g>
  <g transform="translate(150,300)">
    <circle cx="6" cy="-5" r="4" fill="#6fb8b3"/>
    <text x="20" y="0" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#8fa3ba">MIT licensed, self-hosted, no telemetry</text>
  </g>

  <g transform="translate(760,220)">
    <rect x="0" y="0" width="360" height="130" rx="10" fill="none" stroke="#2a4058" stroke-width="1.5" stroke-dasharray="4 4"/>
    <text x="20" y="30" font-family="Courier New, monospace" font-size="11" fill="#8fa3ba" letter-spacing="1">CLIENT</text>
    <text x="20" y="50" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#eef3f8">Al-Madina Foods</text>
    <text x="200" y="30" font-family="Courier New, monospace" font-size="11" fill="#8fa3ba" letter-spacing="1">TYPE</text>
    <text x="200" y="50" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#eef3f8">Restaurant</text>
    <text x="20" y="92" font-family="Courier New, monospace" font-size="11" fill="#8fa3ba" letter-spacing="1">PALETTE</text>
    <text x="20" y="112" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#eef3f8">Brass &amp; Gold</text>
    <text x="200" y="92" font-family="Courier New, monospace" font-size="11" fill="#8fa3ba" letter-spacing="1">COPY</text>
    <text x="200" y="112" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#6fb8b3">AI-GENERATED</text>
  </g>

  <rect x="0" y="396" width="1200" height="4" fill="url(#accentGrad)"/>
</svg>
